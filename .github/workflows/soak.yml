# Nightly soak: every scenario, both sides, an hour of simulation each with a
# random operator at every station, save/load continuation checks and a
# memory watch (tools/soak_game.py). A failure opens an issue labelled "soak"
# with the report, or adds the report to the open one, so a crash is found
# before a player finds it. Not hardware acceptance (docs/hardware-acceptance.md).
name: Soak

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Simulation minutes per scenario and side"
        default: "60"

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        scenario: [s1_patrouille, s2_doppeljagd, s3_abfang, s4_zufall, s5_durchbruch,
                   s6_aufklaerung, s7_geleitzug, s8_meerenge, s9_kampfschwimmer,
                   s10_versorger]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Soak ${{ matrix.scenario }}
        run: >-
          python tools/soak_game.py --scenario ${{ matrix.scenario }}
          --minutes ${{ github.event.inputs.minutes || '60' }}
          --report soak-${{ matrix.scenario }}.md

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ matrix.scenario }}
          path: soak-${{ matrix.scenario }}.md
          if-no-files-found: ignore

  report:
    needs: soak
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: soak-*
          merge-multiple: true

      - name: Open or update the soak issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Nightly soak failed: $RUN_URL"
            echo
            grep -l "FAIL" soak-*.md | xargs -r cat
          } > body.md
          head -c 60000 body.md > issue.md
          gh label create soak --color B60205 --description "Nightly soak failures" 2>/dev/null || true
          number=$(gh issue list --label soak --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue.md
          else
            gh issue create --title "Nightly soak failed" --label soak --body-file issue.md
          fi
