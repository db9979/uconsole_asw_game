<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>U-Jagd Commander</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="bootstrap" class="bootstrap"><span class="brand-mark" aria-hidden="true"></span><strong>U-Jagd Commander</strong><span class="loading" role="progressbar" data-i18n-aria="loading"></span></div>
  <div id="shell" hidden>
    <header class="masthead">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><strong>U-Jagd <span>Commander</span></strong><p data-i18n="subtitle"></p></div></div>
      <div class="preferences">
        <label class="language"><span data-i18n="language"></span><select id="language"><option value="en" data-i18n="english"></option><option value="de" data-i18n="german"></option></select></label>
        <button id="sound" type="button" aria-pressed="false" data-i18n="sound_off"></button>
        <label class="volume"><span data-i18n="volume"></span><input id="volume" type="range" min="0" max="100" value="25"></label>
        <button id="disconnect" type="button" class="quiet" data-i18n="disconnect" hidden></button>
      </div>
    </header>
    <p id="connection" class="connection" role="status" aria-live="polite"></p>
    <section id="pairing" class="pairing">
      <div class="pair-intro"><p class="eyebrow" data-i18n="pair_eyebrow"></p><h1 data-i18n="pair_title"></h1><p data-i18n="pair_intro"></p><div class="scope-note"><span class="scope-line" aria-hidden="true"></span><p data-i18n="authority_note"></p></div></div>
      <form id="pair-form" class="pair-card">
        <h2 data-i18n="pair_heading"></h2><p id="pair-help" data-i18n="pair_help"></p>
        <label for="code" data-i18n="pair_code"></label><input id="code" name="code" type="text" required maxlength="6" pattern="[0-9]{3}[A-Za-z]{3}" placeholder="482KMT" aria-describedby="pair-help" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button id="pair-submit" class="primary" type="submit" data-i18n="pair_submit"></button><p id="pair-error" class="error" role="alert"></p>
        <p class="fine" data-i18n="pair_security"></p>
      </form>
    </section>
    <main id="operations" hidden>
      <div class="tablist" role="tablist" data-i18n-aria="tabs">
        <button id="tab-operations" type="button" role="tab" aria-selected="true" aria-controls="panel-operations" tabindex="0" data-i18n="tab_operations"></button>
        <button id="tab-lookout" type="button" role="tab" aria-selected="false" aria-controls="panel-lookout" tabindex="-1" data-i18n="tab_lookout"></button>
        <button id="tab-guide" type="button" role="tab" aria-selected="false" aria-controls="panel-guide" tabindex="-1" data-i18n="tab_guide"></button>
        <button id="tab-contacts" type="button" role="tab" aria-selected="false" aria-controls="panel-contacts" tabindex="-1" data-i18n="tab_contacts"></button>
      </div>
      <div class="tab-deck">
        <section id="panel-operations" class="tab-panel operations-panel" role="tabpanel" aria-labelledby="tab-operations" tabindex="0">
      <section class="mission-strip" data-i18n-aria="mission">
        <div class="mission-name"><p class="eyebrow" data-i18n="mission"></p><h1 id="mission-name"></h1><p id="objective"></p></div>
        <dl id="mission-metrics" class="metrics"></dl>
        <div class="session"><span id="phase" class="badge"></span><p id="command-permission"></p></div>
      </section>
      <div class="workspace">
        <section class="panel contacts-panel"><div class="panel-heading"><h2 data-i18n="contacts"></h2><span id="track-count" class="counter"></span></div><p class="panel-help" data-i18n="selection_note"></p><div id="track-list" class="track-list" data-i18n-aria="contacts"></div></section>
        <section class="panel chart-panel">
          <div class="panel-heading"><h2 data-i18n="picture"></h2><span class="north" data-i18n="north_up"></span></div>
          <div class="chart-toolbar"><button id="zoom-in" type="button" data-i18n="zoom_in"></button><button id="zoom-out" type="button" data-i18n="zoom_out"></button><button id="fit" type="button" data-i18n="fit"></button><button id="follow" type="button" aria-pressed="false" data-i18n="follow"></button><output id="chart-scale"></output></div>
          <canvas id="chart" tabindex="0" data-i18n-aria="chart_help"></canvas>
          <p class="chart-help" data-i18n="chart_help"></p>
          <div class="legend"><span class="selected-key" data-i18n="selected"></span><span class="crew-key" data-i18n="crew_target"></span><span class="proposal-key" data-i18n="proposal"></span><span class="bearing-key" data-i18n="bearing_only"></span></div>
          <p id="chart-disclaimer" class="fine"></p>
        </section>
        <section class="panel details-panel"><div class="panel-heading"><h2 data-i18n="contact_detail"></h2><span class="local-tag" data-i18n="local"></span></div>
          <p id="no-selection" class="empty" data-i18n="select_contact"></p>
          <div id="track-detail" hidden><h3 id="detail-label"></h3><div id="detail-badges" class="badges"></div><dl id="detail-metrics" class="detail-metrics"></dl>
            <form id="classification-form" class="annotation-form"><label for="classification" data-i18n="classification"></label><div class="setter"><select id="classification"><option value="" data-i18n="unknown"></option><option value="U_BOOT" data-i18n="class_submarine"></option><option value="KAMPFSCHIFF" data-i18n="class_warship"></option><option value="BIOLOGISCH" data-i18n="class_biological"></option><option value="FAHRZEUG" data-i18n="class_vehicle"></option></select><button id="apply-classification" type="submit" data-i18n="apply"></button></div></form>
            <form id="affiliation-form" class="annotation-form"><label for="affiliation" data-i18n="affiliation"></label><div class="setter"><select id="affiliation"><option value="UNKNOWN" data-i18n="aff_unknown"></option><option value="FRIEND" data-i18n="aff_friend"></option><option value="NEUTRAL" data-i18n="aff_neutral"></option><option value="HOSTILE" data-i18n="aff_hostile"></option></select><button id="apply-affiliation" type="submit" data-i18n="apply"></button></div></form>
            <p class="fine" data-i18n="annotation_note"></p><button id="propose" type="button" class="primary" data-i18n="propose"></button>
          </div>
          <div class="proposal-box"><h3 data-i18n="proposal"></h3><p id="proposal-status"></p><p class="fine" data-i18n="proposal_note"></p><button id="clear-proposal" type="button" data-i18n="clear_proposal"></button></div>
          <div class="proposal-box"><h3 data-i18n="navigation"></h3>
            <p id="navigation-status" role="status" aria-live="polite"></p>
            <p id="navigation-note" class="fine" data-i18n="navigation_note"></p>
            <form id="navigation-form" class="annotation-form" aria-describedby="navigation-note">
              <label for="navigation-course" data-i18n="navigation_course"></label><input id="navigation-course" name="course" type="number" min="0" max="359.99999999999994" step="any" inputmode="decimal" autocomplete="off">
              <label for="navigation-speed" data-i18n="navigation_speed"></label><input id="navigation-speed" name="speed_kn" type="number" min="0" max="25" step="any" inputmode="decimal" autocomplete="off">
              <button id="propose-navigation" type="submit" class="primary" data-i18n="navigation_propose"></button>
            </form>
          </div>
          <p id="command-status" class="command-status" role="status" aria-live="polite"></p>
          <div id="command-reconcile" class="command-reconcile" hidden><p id="command-retry-note" class="fine" data-i18n="command_retry_note"></p><button id="retry-command" type="button" aria-describedby="command-retry-note" data-i18n="command_retry"></button></div>
        </section>
      </div>
      <div class="support-grid">
        <section class="panel own-panel"><div class="panel-heading"><h2 data-i18n="ownship"></h2><span class="own-key" aria-hidden="true"></span></div><dl id="own-metrics" class="metrics"></dl><h3 data-i18n="inventory"></h3><dl id="inventory" class="metrics"></dl><h3 data-i18n="helicopter"></h3><dl id="helo-metrics" class="metrics"></dl></section>
        <section class="panel"><div class="panel-heading"><h2 data-i18n="damage"></h2><span id="alarm-count" class="counter"></span></div><div id="damage-list" class="damage-list"></div></section>
        <section class="panel"><div class="panel-heading"><h2 data-i18n="events"></h2><span class="local-tag" data-i18n="live_feed"></span></div><ol id="event-list" class="event-list"></ol></section>
      </div>
      <footer><span data-i18n="observation_note"></span><span id="snapshot-meta"></span></footer>
        </section>
        <section id="panel-lookout" class="tab-panel lookout-panel" role="tabpanel" aria-labelledby="tab-lookout" tabindex="0" hidden>
          <header class="lookout-bar">
            <div class="lookout-title"><p class="eyebrow" data-i18n="lookout_eyebrow"></p><h1 data-i18n="lookout_title"></h1></div>
            <div class="lookout-environment" aria-live="polite"><span><span data-i18n="sea_state"></span> <strong id="lookout-sea"></strong></span><span id="lookout-light"></span></div>
            <div class="lookout-toolbar"><button id="lookout-zoom-in" type="button" data-i18n="zoom_in"></button><button id="lookout-zoom-out" type="button" data-i18n="zoom_out"></button><button id="lookout-reset" type="button" data-i18n="lookout_default_short" data-i18n-aria="lookout_reset"></button><output id="lookout-range"></output></div>
          </header>
          <div id="lookout-scope" class="lookout-scope"><canvas id="lookout" tabindex="0" aria-describedby="lookout-note lookout-own" data-i18n-aria="lookout_help"></canvas></div>
          <p id="lookout-note" class="lookout-note" data-i18n="lookout_note"></p>
          <section class="visually-hidden"><h2 data-i18n="lookout_observations"></h2><p id="lookout-own"></p><ul id="lookout-observations"></ul></section>
        </section>
        <section id="panel-guide" class="tab-panel guide-panel" role="tabpanel" aria-labelledby="tab-guide" tabindex="0" hidden>
          <header class="guide-header"><p class="eyebrow" data-i18n="guide_eyebrow"></p><h1 data-i18n="guide_title"></h1><p data-i18n="guide_intro"></p></header>
          <div class="guide-layout">
            <nav id="guide-nav" class="guide-nav panel" data-i18n-aria="guide_navigation">
              <h2 data-i18n="guide_navigation"></h2>
              <ol>
                <li><a href="#guide-access" data-i18n="guide_nav_access"></a></li>
                <li><a href="#guide-operations" data-i18n="guide_nav_operations"></a></li>
                <li><a href="#guide-observations" data-i18n="guide_nav_observations"></a></li>
                <li><a href="#guide-proposals" data-i18n="guide_nav_proposals"></a></li>
                <li><a href="#guide-eloka" data-i18n="guide_nav_eloka"></a></li>
                <li><a href="#guide-analyzer" data-i18n="guide_nav_analyzer"></a></li>
                <li><a href="#guide-connection" data-i18n="guide_nav_connection"></a></li>
                <li><a href="#guide-authority" data-i18n="guide_nav_authority"></a></li>
              </ol>
            </nav>
            <article class="guide-copy">
              <section id="guide-access" tabindex="-1"><h2 data-i18n="guide_access_title"></h2><p data-i18n="guide_access_pairing"></p><p data-i18n="guide_access_grant"></p><p data-i18n="guide_access_revoke"></p></section>
              <section id="guide-operations" tabindex="-1"><h2 data-i18n="guide_operations_title"></h2><p data-i18n="guide_operations_picture"></p><p data-i18n="guide_operations_local"></p><p data-i18n="guide_lookout"></p></section>
              <section id="guide-observations" tabindex="-1"><h2 data-i18n="guide_observations_title"></h2><p data-i18n="guide_observations_age"></p><p data-i18n="guide_observations_quality"></p><p data-i18n="guide_observations_annotations"></p></section>
              <section id="guide-proposals" tabindex="-1"><h2 data-i18n="guide_proposals_title"></h2><p data-i18n="guide_target_proposal"></p><p data-i18n="guide_navigation_proposal"></p><p data-i18n="guide_message_box"></p><p data-i18n="guide_reconciliation"></p></section>
              <section id="guide-eloka" tabindex="-1"><h2 data-i18n="guide_eloka_title"></h2><p data-i18n="guide_eloka_esm"></p><p data-i18n="guide_eloka_correlation"></p><p data-i18n="guide_emcon"></p></section>
              <section id="guide-analyzer" tabindex="-1"><h2 data-i18n="guide_analyzer_title"></h2><p data-i18n="guide_analyzer_contacts"></p><p data-i18n="guide_analyzer_limits"></p></section>
              <section id="guide-connection" tabindex="-1"><h2 data-i18n="guide_connection_title"></h2><p data-i18n="guide_security"></p><p data-i18n="guide_reconnect"></p></section>
              <section id="guide-authority" class="guide-warning" tabindex="-1"><h2 data-i18n="guide_authority_title"></h2><p data-i18n="guide_authority_forbidden"></p><p data-i18n="guide_authority_summary"></p></section>
            </article>
          </div>
        </section>
        <section id="panel-contacts" class="tab-panel analyzer-panel" role="tabpanel" aria-labelledby="tab-contacts" tabindex="0" hidden>
          <header class="analyzer-header"><div><p class="eyebrow" data-i18n="analyzer_eyebrow"></p><h1 data-i18n="analyzer_title"></h1><p class="panel-help" data-i18n="analyzer_note"></p></div><span id="analysis-count" class="counter"></span></header>
          <div class="analyzer-workspace">
            <section class="panel analyzer-browser"><div class="analyzer-filters"><label for="analysis-filter" data-i18n="analyzer_filter"></label><input id="analysis-filter" type="search" maxlength="96" autocomplete="off"><label for="analysis-category" data-i18n="analyzer_category"></label><select id="analysis-category"><option value="" data-i18n="analyzer_all"></option><option value="subs.json" data-i18n="analyzer_submarines"></option><option value="warships.json" data-i18n="analyzer_warships"></option><option value="civilians.json" data-i18n="analyzer_civilians"></option><option value="aircraft.json" data-i18n="analyzer_aircraft"></option><option value="animals.json" data-i18n="analyzer_animals"></option><option value="torpedoes.json" data-i18n="analyzer_torpedoes"></option><option value="decoys.json" data-i18n="analyzer_decoys"></option></select></div><div id="analysis-list" class="analysis-list" data-i18n-aria="analyzer_results"></div></section>
            <section class="panel analyzer-detail"><p id="analysis-status" class="empty" role="status" aria-live="polite"></p><article id="analysis-profile" hidden><div class="panel-heading"><div><p id="analysis-key" class="eyebrow"></p><h2 id="analysis-name"></h2></div><span id="analysis-resource" class="local-tag"></span></div><div class="analysis-legend"><p data-i18n="analyzer_spectrum_legend"></p><p data-i18n="analyzer_hypothesis_legend"></p></div><div id="analysis-images" class="analysis-images"></div><dl id="analysis-metrics" class="detail-metrics analyzer-metrics"></dl><section class="analysis-components"><h3 data-i18n="analyzer_systems"></h3><dl id="analysis-systems" class="detail-metrics"></dl></section></article></section>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
