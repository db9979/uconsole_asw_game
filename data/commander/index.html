<!doctype html>
<html lang="en">
<head>

<body>
  <div id="bootstrap" class="bootstrap"><span class="brand-mark" aria-hidden="true"></span><strong>U-Jagd Commander</strong><span class="loading" role="progressbar" data-i18n-aria="loading"></span></div>

        <button id="disabled-control-explain" type="button" aria-expanded="false" aria-controls="disabled-control-help" data-i18n-aria="disabled_control_explain" hidden>?</button>
        <button id="disconnect" type="button" class="quiet" data-i18n="disconnect" hidden></button>
      </div>

    <p id="connection" class="connection" role="status" aria-live="polite"></p>
    <p id="disabled-control-help" class="disabled-control-help" role="status" aria-live="polite" hidden></p>

        <p class="fine" data-i18n="pair_security"></p>

    </section>
    <main id="lobby" class="lobby" hidden>

    </section>

        <button id="tab-operations" type="button" role="tab" aria-selected="true" aria-controls="panel-operations" tabindex="0" data-i18n="tab_operations"></button>
        <button id="tab-lookout" type="button" role="tab" aria-selected="false" aria-controls="panel-lookout" tabindex="-1" data-i18n="tab_lookout"></button>

        <button id="tab-contacts" type="button" role="tab" aria-selected="false" aria-controls="panel-contacts" tabindex="-1" data-i18n="tab_contacts"></button>

      </section>
      <section id="station-view" class="station-view" aria-label="" data-i18n-aria="station_view" hidden>

        <section id="station-sonar" class="station-section" data-station-role="sonar" aria-labelledby="station-sonar-title" hidden><div class="station-heading"><p class="eyebrow" data-i18n="station_dashboard"></p><h2 id="station-sonar-title" data-i18n="station_sonar"></h2></div><div class="station-grid"><article class="station-card-view"><h3 data-i18n="station_settings"></h3><dl id="sonar-settings" class="detail-metrics"></dl></article><article class="station-card-view station-controls station-wide"><h3 data-i18n="sonar_controls"></h3><label for="sonar-control-page" data-i18n="sonar_control_page"></label><select id="sonar-control-page"><option value="listen" data-i18n="sonar_page_listen"></option><option value="array" data-i18n="sonar_page_array"></option><option value="analysis" data-i18n="sonar_page_analysis"></option></select><div class="control-page" data-sonar-page="listen"><form id="sonar-bearing-form" class="control-form"><label for="sonar-bearing" data-i18n="sonar_listen_bearing"></label><input id="sonar-bearing" type="number" min="0" max="359.99999999999994" step="any" required><button id="sonar-bearing-submit" type="submit" data-i18n="sonar_set_bearing"></button></form><button id="sonar-clear-focus" type="button" data-i18n="sonar_clear_focus"></button><button id="sonar-ping" type="button" data-i18n="sonar_ping"></button></div><div class="control-page" data-sonar-page="array" hidden><label for="sonar-array-mode" data-i18n="sonar_array_mode"></label><select id="sonar-array-mode"><option value="BOW" data-i18n="sonar_bow"></option><option value="TOWED" data-i18n="sonar_towed"></option></select><button id="sonar-array-apply" type="button" data-i18n="apply"></button><button id="sonar-tas" type="button"></button><form id="sonar-depth-form" class="control-form"><label for="sonar-depth" data-i18n="sonar_tow_depth"></label><input id="sonar-depth" type="number" min="20" max="260" step="any" required><button id="sonar-depth-submit" type="submit" data-i18n="sonar_set_d         <section id="station-weapons" class="station-section" data-station-role="weapons" aria-labelledby="station-weapons-title" hidden><div class="station-heading"><p class="eyebrow" data-i18n="station_dashboard"></p><h2 id="station-weapons-title" data-i18n="station_weapons"></h2></div><div class="station-grid"><article class="station-card-view"><h3 data-i18n="inventory"></h3><dl id="weapons-inventory" class="detail-metrics"></dl></article><article class="station-card-view"><h3 data-i18n="station_readiness"></h3><dl id="weapons-readiness" class="detail-metrics"></dl></article><article class="station-card-view"><h3 data-i18n="weapons_tubes"></h3><div id="weapons-tubes" class="station-list compact-list"></div></article><article class="station-card-view"><h3 data-i18n="station_designated_target"></h3><div id="weapons-target" class="station-list"></div></article><article class="station-card-view station-wide direct-fire-controls" aria-labelledby="weapons-fire-title"><h3 id="weapons-fire-title" data-i18n="weapons_fire_control"></h3><div class="fire-grid"><label for="weapons-fire-target" data-i18n="fire_target"></label><select id="weapons-fire-target"></select><label for="weapons-fire-depth" data-i18n="fire_depth"></label><input id="weapons-fire-depth" type="number" min="10" max="300" step="any" inputmode="decimal" autocomplete="off"><button id="weapons-fire-torpedo" type="button" data-fire-action="weapons_launch_torpedo" data-i18n="weapons_launch_torpedo"></button><button id="weapons-fire-helicopter" type="button" data-fire-action="helicopter_launch_torpedo" data-i18n="helicopter_launch_torpedo"></button><button id="weapons-fire-nixie" type="button" data-fire-action="weapons_deploy_nixie" data-i18n="weapons_deploy_nixie"></button></div><p id="weapons-fire-status" class="fire-status" role="status" aria-live="polite"></p></article><article class="station-card-view station-wide"><h3 data-i18n="station_own_weapons"></h3><div id="weapons-own" class="station-list"></div></ar         <section id="station-damage" class="station-section" data-station-role="damage" aria-labelledby="station-damage-title" hidden><div class="station-heading"><p class="eyebrow" data-i18n="station_dashboard"></p><h2 id="station-damage-title" data-i18n="station_damage"></h2></div><div class="station-grid"><article class="station-card-view"><h3 data-i18n="station_damage_summary"></h3><dl id="damage-summary" class="detail-metrics"></dl></article><article class="station-card-view"><h3 data-i18n="station_damage_teams"></h3><div id="damage-teams" class="station-list"></div></article><article class="station-card-view station-wide"><h3 data-i18n="station_compartments"></h3><div id="damage-compartments" class="station-list"></div></article></div></section>
        <section id="station-opz" class="station-section" data-station-role="opz" aria-labelledby="station-opz-title" hidden><div class="station-heading"><p class="eyebrow" data-i18n="station_dashboard"></p><h2 id="station-opz-title" data-i18n="station_opz"></h2></div><div class="station-grid"><article class="station-card-view"><h3 data-i18n="station_radar"></h3><dl id="opz-radar-summary" class="detail-metrics"></dl></article><article class="station-card-view"><h3 data-i18n="opz_asm_defense"></h3><dl id="opz-defense" class="detail-metrics"></dl></article><article class="station-card-view station-wide direct-fire-controls" aria-labelledby="opz-fire-title"><h3 id="opz-fire-title" data-i18n="opz_asm_engagement"></h3><div class="fire-grid"><label for="opz-fire-target" data-i18n="fire_target"></label><select id="opz-fire-target"></select><button id="opz-fire-essm" type="button" data-fire-action="opz_launch_essm" data-i18n="opz_launch_essm"></button><button id="opz-fire-chaff" type="button" data-fire-action="opz_launch_chaff" data-i18n="opz_launch_chaff"></button></div><p id="opz-fire-status" class="fire-status" role="status" aria-live="polite"></p></article><article class="station-card-view"><h3 data-i18n="station_own_assets"></h3><div id="opz-assets" class="station-list"></div></article><article class="station-card-view"><h3 data-i18n="station_source_classifications"></h3><div id="opz-classifications" class="station-list"></div></article><article class="station-card-view"><h3 data-i18n="station_fusions"></h3><div id="opz-fusions" class="station-list"></div></article><article class="station-card-view station-wide"><h3 data-i18n="station_observations"></h3><div id="opz-observations" class="station-list"></div></article></div></section>
        <section id="station-radio" class="station-section" data-station-role="radio" aria-labelledby="station-radio-title" hidden><div class="station-heading"><p class="eyebrow" data-i18n="station_dashboard"></p><h2 id="station-radio-title" data-i18n="station_radio"></h2></div><div class="station-grid"><article class="station-card-view"><h3 data-i18n="station_observations"></h3><div id="radio-observations" class="station-list"></div></article><article class="station-card-view"><h3 data-i18n="station_logged_fixes"></h3><div id="radio-fixes" class="station-list"></div></article><article class="station-card-view"><h3 data-i18n="station_logged_bearings"></h3><div id="radio-bearings" class="station-list"></div></article><article class="station-card-view"><h3 data-i18n="station_messages"></h3><div id="radio-messages" class="station-list"></div></article></div></section>
        <section id="station-engine" class="station-section" data-station-role="engine" aria-labelledby="station-engine-title" hidden><div class="station-heading"><p class="eyebrow" data-i18n="station_dashboard"></p><h2 id="station-engine-title" data-i18n="station_engine"></h2></div><div class="station-grid"><article class="station-card-view"><h3 data-i18n="station_propulsion"></h3><dl id="engine-propulsion" class="detail-metrics"></dl></article><article class="station-card-view"><h3 data-i18n="station_machinery"></h3><dl id="engine-machinery" class="detail-metrics"></dl></article><article class="station-card-view"><h3 data-i18n="station_environment_effects"></h3><dl id="engine-environment" class="detail-metrics"></dl></article><article class="station-card-view station-controls station-wide"><h3 data-i18n="engine_controls"></h3><label for="engine-telegraph" data-i18n="telegraph"></label><select id="engine-telegraph"></select><button id="engine-telegraph-submit" type="button" data-i18n="engine_order_telegraph"></button><form id="engine-course-form" class="control-form"><label for="engine-course" data-i18n="engine_course"></label><input id="engine-course" type="number" min="0" max="359.99999999999994" step="any" required><button id="engine-course-submit" type="submit" data-i18n="engine_order_course"></button></form><form id="engine-speed-form" class="control-form"><label for="engine-speed" data-i18n="engine_speed"></label><input id="engine-speed" type="number" min="0" max="25" step="any" required><button id="engine-speed-submit" type="submit" data-i18n="engine_order_speed"></button></form><button id="engine-quiet" type="button"></button></article></div></section>
        <section id="station-helicopter" class="station-section" data-station-role="helicopter" aria-labelledby="station-helicopter-title" hidden><div class="station-heading"><p class="eyebrow" data-i18n="station_dashboard"></p><h2 id="station-helicopter-title" data-i18n="station_helicopter"></h2></div><div class="station-grid"><article class="station-card-view"><h3 data-i18n="station_asset"></h3><dl id="helicopter-asset" class="detail-metrics"></dl></article><article class="station-card-view"><h3 data-i18n="station_readiness"></h3><dl id="helicopter-readiness" class="detail-metrics"></dl></article><article class="station-card-view"><h3 data-i18n="station_waypoint"></h3><dl id="helicopter-waypoint" class="detail-metrics"></dl><form id="helicopter-waypoint-form" class="control-form"><label for="helicopter-x" data-i18n="helicopter_x"></label><input id="helicopter-x" type="number" min="0" max="1000" step="any" required><label for="helicopter-y" data-i18n="helicopter_y"></label><input id="helicopter-y" type="number" min="0" max="1000" step="any" required><button id="helicopter-waypoint-submit" type="submit" data-i18n="helicopter_set_waypoint"></button></form></article><article class="station-card-view station-controls"><h3 data-i18n="helicopter_controls"></h3><button id="helicopter-launch" type="button" data-i18n="helicopter_launch"></button><button id="helicopter-return" type="button" data-i18n="helicopter_return"></button><button id="helicopter-buoy" type="button" data-i18n="helicopter_buoy"></button></article><article class="station-card-view station-wide direct-fire-controls" aria-labelledby="helicopter-fire-title"><h3 id="helicopter-fire-title" data-i18n="helicopter_release_control"></h3><div class="fire-grid"><label for="helicopter-fire-target" data-i18n="fire_target"></label><select id="helicopter-fire-target"></select><label for="helicopter-fire-depth" data-i18n="fire_depth"></label><input id="helicopter-fire-depth" type="number" min="10" max="300" step="any" in         <section id="role-visuals" class="role-visuals station-wide" hidden aria-labelledby="role-visual-title">
          <div class="visual-heading"><h3 id="role-visual-title" data-i18n="visual_picture"></h3><p id="role-visual-state" class="visual-state" role="status" aria-live="polite"></p></div>
          <section id="map-visual" class="visual-panel map-visual" hidden>
