[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "u-jagd"
dynamic = ["version"]
description = "U-Jagd - a frigate anti-submarine warfare game for the uConsole"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "data/commander/fonts/ofl-*.txt"]
authors = [
    {name = "Dominik Bornhäußer"},
]
requires-python = ">=3.11"
dependencies = ["pygame>=2.6", "numpy>=2.0", "websockets>=12"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Natural Language :: German",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Simulation",
]

[project.urls]
Homepage = "https://github.com/db9979/uconsole_asw_game"
Repository = "https://github.com/db9979/uconsole_asw_game"
Issues = "https://github.com/db9979/uconsole_asw_game/issues"

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8", "pytest-xdist>=3"]
windows = ["pyinstaller>=6.10,<7"]

[project.scripts]
u-jagd = "main:main"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "data*"]
namespaces = true

[tool.setuptools.package-data]
"data.contacts" = ["*.json"] # Built-in contact catalog resources.
"data.loadouts" = ["*.json"] # Fictional ownship mission loadouts.
"data.coastlines" = ["*.json", "*.json.gz"]
"data.editor_templates" = ["*.json"]
"data.i18n" = ["*.json"]
"data.commander" = ["*.html", "*.js", "*.css", "css/*.css", "js/**/*.js",
                    "fonts/*.woff2", "fonts/*.txt"]
"data.manual" = ["*.md"]
"data.contact_analysis" = ["manifest.json", "*.png"]

[tool.setuptools.dynamic]
version = {attr = "src.core.version.APP_VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default (pytest-xdist); "-n 0" runs serially.  Every worker
# process gets its own SDL dummy drivers and save/settings directory from
# conftest.py, and the loopback test servers bind ephemeral ports.
addopts = "-n auto --dist loadgroup"
markers = [
    "browser: drives headless Chromium (skipped when it is not installed)",
    "xdist_group: pytest-xdist scheduling group (browser tests share two)",
    "slow: takes more than about 20 s on the development host",
    "hardware: needs the real uConsole (never run in CI)",
]
