[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "u-jagd"
dynamic = ["version"]
description = "U-Jagd - a frigate anti-submarine warfare game for the uConsole"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Dominik Bornhäußer"},
]
requires-python = ">=3.11"
dependencies = ["pygame>=2.6", "numpy>=2.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Natural Language :: English",
    "Natural Language :: German",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Simulation",
]

[project.urls]
Homepage = "https://github.com/db9979/uconsole_asw_game"
Repository = "https://github.com/db9979/uconsole_asw_game"
Issues = "https://github.com/db9979/uconsole_asw_game/issues"

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8"]

[project.scripts]
u-jagd = "main:main"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "data*"]
namespaces = true

[tool.setuptools.package-data]
"data.contacts" = ["*.json"] # Built-in contact catalog resources.
"data.coastlines" = ["*.json", "*.json.gz"]
"data.editor_templates" = ["*.json"]
"data.i18n" = ["*.json"]

[tool.setuptools.dynamic]
version = {attr = "src.core.version.APP_VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
